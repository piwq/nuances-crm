# Конфиг для dev-стека: один origin, всё API/WS/media проксируется в backend.
# Монтируется поверх nginx.conf из образа (docker-compose.dev.yml, сервис frontend).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50M;

    # DNS docker: имя backend резолвится на каждый запрос.
    # Без этого nginx кеширует IP со старта и после пересоздания backend
    # весь API отдаёт 502, пока не перезапустишь сам nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend:8000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # в dev статику и media отдаёт сам runserver (DEBUG=True)
    location /static/ {
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
    }

    location /media/ {
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://$backend_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
