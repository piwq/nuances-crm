
services:
  db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: legal_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: "no"
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://postgres:postgres@db:5432/legal_crm
      SECRET_KEY: dev-secret-key
      DEBUG: "True"
      # dev в локальной сети, IP хоста динамический (DHCP)
      ALLOWED_HOSTS: "*"
      # берётся из корневого .env; пусто = Telegram-уведомления выключены
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./backend:/app
      - media_files_dev:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: "no"
    # send_deadline_reminders идемпотентна (дедуп по Notification.key),
    # поэтому часовой цикл безопасен
    command: sh -c 'while true; do python manage.py send_deadline_reminders; sleep 3600; done'
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://postgres:postgres@db:5432/legal_crm
      SECRET_KEY: dev-secret-key
      DEBUG: "True"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: "no"

volumes:
  postgres_data_dev:
  media_files_dev:
