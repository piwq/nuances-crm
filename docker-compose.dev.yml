# Явное имя проекта: prod-файл использует другое (nuances-crm-demo),
# чтобы его запуск не пересоздавал dev-контейнеры и не подменял тома.
name: nuances-crm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: legal_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://postgres:postgres@db:5432/legal_crm
      SECRET_KEY: dev-secret-key
      DEBUG: "True"
      # dev в локальной сети, IP хоста динамический (DHCP)
      ALLOWED_HOSTS: "*"
      # берётся из корневого .env; пусто = Telegram-уведомления выключены
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./backend:/app
      - media_files_dev:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    # send_deadline_reminders идемпотентна (дедуп по Notification.key),
    # поэтому часовой цикл безопасен
    command: sh -c 'while true; do python manage.py send_deadline_reminders; python manage.py mark_overdue_invoices; sleep 3600; done'
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://postgres:postgres@db:5432/legal_crm
      SECRET_KEY: dev-secret-key
      DEBUG: "True"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    # при пустом TELEGRAM_BOT_TOKEN команда переходит в режим ожидания
    command: python manage.py run_telegram_bot
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://postgres:postgres@db:5432/legal_crm
      SECRET_KEY: dev-secret-key
      DEBUG: "True"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # пусто = относительные URL, всё ходит через этот же nginx
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data_dev:
  media_files_dev:
