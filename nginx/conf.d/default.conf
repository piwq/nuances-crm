server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # DNS docker: имена сервисов резолвятся на каждый запрос, иначе nginx
    # держит IP со старта и после пересоздания backend/frontend отдаёт 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend:8000;
    set $frontend_host frontend:80;

    # Vue SPA
    location / {
        proxy_pass http://$frontend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django API
    location /api/ {
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # генерация PDF/DOCX синхронная — даём ей время
        proxy_read_timeout 120s;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets
    location /ws/ {
        proxy_pass http://$backend_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Django static
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    # Загруженные файлы (аватары и т.п.); DEBUG=False, Django их не отдаёт
    location /media/ {
        alias /app/media/;
    }
}
