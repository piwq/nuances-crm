# Боевой стек CRM «Нюансы».
#
# Запуск:  docker compose up -d --build
# Логи:    docker compose logs -f backend
# Данные живут в томах nuances-crm-prod_* и не пересекаются с dev-стеком
# (у него собственное имя проекта nuances-crm).
name: nuances-crm-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_crm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # миграции и статика — на старте; демо-данные НЕ сидируются
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 --proxy-headers config.asgi:application"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend_net
      - frontend_net

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # все команды идемпотентны (дедуп по ключу/дате), поэтому получасовой цикл безопасен
    command: >
      sh -c 'while true; do
               python manage.py send_deadline_reminders;
               python manage.py mark_overdue_invoices;
               python manage.py generate_recurring_invoices;
               python manage.py send_telegram_digest;
               sleep 1800;
             done'
    volumes:
      - media_files:/app/media
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend_net

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # при пустом TELEGRAM_BOT_TOKEN команда просто ждёт, не перезапускаясь по кругу
    command: python manage.py run_telegram_bot
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # пусто = относительные URL: API, WS и статика идут через тот же nginx
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    networks:
      - frontend_net

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - frontend_net

volumes:
  postgres_data:
  media_files:
  static_files:

networks:
  backend_net:
  frontend_net:
