# Явное имя проекта, отличное от dev (nuances-crm): иначе запуск этого файла
# пересоздаёт dev-контейнеры и подменяет тома.
name: nuances-crm-demo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_crm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_demo --skip-if-exists &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.demo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend_net
      - frontend_net

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # send_deadline_reminders идемпотентна (дедуп по Notification.key),
    # поэтому часовой цикл безопасен
    command: sh -c 'while true; do python manage.py send_deadline_reminders; python manage.py mark_overdue_invoices; sleep 3600; done'
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.demo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend_net

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # при пустом TELEGRAM_BOT_TOKEN команда переходит в режим ожидания
    command: python manage.py run_telegram_bot
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.demo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # пусто = относительные URL: всё (API, WS, static) ходит через nginx
        # того же origin. Намеренно не берём значение из .env (там адрес для
        # dev-режима с отдельным backend на :8000).
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    networks:
      - frontend_net

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - frontend_net

volumes:
  postgres_data:
  media_files:
  static_files:

networks:
  backend_net:
  frontend_net:
